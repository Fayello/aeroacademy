name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Frontend
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # Backend
      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend typecheck
        working-directory: backend
        run: npx tsc --noEmit

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: NEXT_PUBLIC_API_URL=
          tags: |
            ghcr.io/fayello/aeroacademy-frontend:latest
            ghcr.io/fayello/aeroacademy-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/fayello/aeroacademy-backend:latest
            ghcr.io/fayello/aeroacademy-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -eu
            printf '%s\n' '${{ secrets.SERVER_PASSWORD }}' | sudo -S -p '' sh -c '
              set -eu
              compose_file=$(find /root /opt /srv /home -maxdepth 5 -type f \( -name docker-compose.yml -o -name compose.yml \) -exec grep -l "aeroacademy-backend" {} \; 2>/dev/null | head -n 1)
              test -n "$compose_file"
              cd "$(dirname "$compose_file")"
              docker compose pull frontend backend
              docker compose up -d --force-recreate docker-proxy frontend backend
              docker image prune -f
              for migration in $(docker compose exec -T backend sh -c "ls -1 prisma/migrations"); do
                case "$migration" in
                  migration_lock.toml|20260914_repair_*) continue ;;
                esac
                if ! docker compose exec -T db psql -U aeroacademy -d aeroacademy -tAc "SELECT 1 FROM \"_prisma_migrations\" WHERE migration_name = \$\$$migration\$\$ AND finished_at IS NOT NULL LIMIT 1" 2>/dev/null | grep -qx 1; then
                  docker compose exec -T backend npx prisma migrate resolve --applied "$migration"
                fi
              done
              docker compose exec -T backend npx prisma migrate deploy
              sleep 10
              curl -fsS http://localhost:4000/api/v1/labs/health > /dev/null
              curl -fsS http://localhost:3000/ > /dev/null
              echo "Backend: OK"
              echo "Frontend: OK"
            '
