    <rect x="300" y="80" width="180" height="120" rx="8" fill="none" stroke="#10b981" stroke-width="2"/>
    <rect x="530" y="50" width="220" height="180" rx="8" fill="none" stroke="#10b981" stroke-width="2"/>
    <line x1="100" y1="100" x2="250" y2="100" stroke="#10b981" stroke-width="1"/>
