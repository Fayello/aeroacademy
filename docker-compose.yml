services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aeroacademy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d aeroacademy"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  backend:
    image: ghcr.io/fayello/aeroacademy-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/aeroacademy?schema=public
      FRONTEND_URL: https://xpertclass.academy
      BACKEND_URL: https://xpertclass.academy
      SMTP_HOST: smtp.hostinger.com
      SMTP_PORT: "465"
      SMTP_USER: contact@xpertclass.academy
      SMTP_PASS: "Welcome@2027@+"
      REMOTE_DOCKER_HOST: 5.189.182.196
      REMOTE_DOCKER_USER: fayell
      REMOTE_DOCKER_KEY: /app/.ssh_key
      OLLAMA_HOST: http://5.189.182.196:11434
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - uploads_data:/app/uploads
      - /root/.ssh/aeroacademy_deploy:/app/.ssh_key:ro
    networks:
      - backend
      - labs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ghcr.io/fayello/aeroacademy-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
      BACKEND_INTERNAL_URL: "http://backend:4000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - backend

networks:
  backend:
    driver: bridge
  labs:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  uploads_data:
