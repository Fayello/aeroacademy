<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proof vs Paper</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0f1a;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,ctx=document.getElementById('c').getContext('2d');
const NAVY='#0a0f1a',GREEN='#7AD62A';
function easeOut(t){return 1-Math.pow(1-t,3)}
function easeOutBack(t){const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function txt(s,x,y,sz,col,wght,al){ctx.font=(wght||'400')+' '+(sz||24)+'px system-ui,sans-serif';ctx.fillStyle=col||'#fff';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}

window.renderAt=function(t){
  ctx.fillStyle=NAVY;ctx.fillRect(0,0,W,H);

  // Grid
  ctx.save();ctx.globalAlpha=0.04;ctx.strokeStyle=GREEN;ctx.lineWidth=0.5;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();

  // Center divider
  if(t>0.5){
    const da=clamp((t-0.5)/0.3,0,1);
    ctx.save();ctx.globalAlpha=da*0.3;ctx.strokeStyle='#334155';ctx.lineWidth=1;
    ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(W/2,100);ctx.lineTo(W/2,H-100);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
  }

  // Title
  if(t<12){
    const ta=t<0.5?easeOut(t/0.5):t>11?1-easeOut((t-11)/1):1;
    ctx.save();ctx.globalAlpha=ta;
    txt('Proof > Paper',W/2,80,42,'#fff','800');
    ctx.restore();
  }

  // LEFT: Certificate (Paper)
  if(t>1){
    const la=clamp((t-1)/0.5,0,1);
    const lx=W/4;
    ctx.save();ctx.globalAlpha=la;

    // Card
    roundRect(lx-180,160,360,400,16);
    ctx.fillStyle='rgba(30,41,59,0.8)';ctx.fill();
    ctx.strokeStyle='#334155';ctx.lineWidth=1;ctx.stroke();

    // Certificate icon
    roundRect(lx-50,200,100,80,8);
    ctx.fillStyle='#1e293b';ctx.fill();
    ctx.strokeStyle='#475569';ctx.lineWidth=1;ctx.stroke();
    txt('📄',lx,240,36);

    // Fake text lines
    for(let i=0;i<4;i++){
      const w=120+Math.sin(i)*40;
      roundRect(lx-w/2,320+i*30,w,8,4);
      ctx.fillStyle='#1e293b';ctx.fill();
    }

    // X mark
    if(t>2.5){
      const xa=clamp((t-2.5)/0.3,0,1);
      ctx.globalAlpha=xa;
      ctx.beginPath();ctx.arc(lx,440,28,0,Math.PI*2);ctx.fillStyle='rgba(239,68,68,0.2)';ctx.fill();
      txt('✕',lx,440,28,'#ef4444','800');
    }

    txt('Certificate',lx,580,20,'#64748b','500');
    txt('"I passed a test"',lx,610,16,'#475569','400');
    ctx.restore();
  }

  // RIGHT: Portfolio (Proof)
  if(t>3){
    const ra=clamp((t-3)/0.5,0,1);
    const rx=W*3/4;
    ctx.save();ctx.globalAlpha=ra;

    // Card
    roundRect(rx-180,160,360,400,16);
    ctx.fillStyle='rgba(30,41,59,0.8)';ctx.fill();
    ctx.strokeStyle=GREEN+'40';ctx.lineWidth=1.5;ctx.stroke();

    // Skill bars
    const skills=[
      {name:'Security',pct:0.92,color:'#10b981'},
      {name:'DevOps',pct:0.85,color:'#3b82f6'},
      {name:'Linux',pct:0.78,color:'#f59e0b'},
      {name:'Cloud',pct:0.88,color:'#8b5cf6'},
    ];
    skills.forEach((s,i)=>{
      const sy=210+i*60;
      txt(s.name,rx-140,sy,13,'#94a3b8','500','left');
      roundRect(rx-140,sy+10,280,12,6);
      ctx.fillStyle='#1e293b';ctx.fill();
      const barW=280*s.pct*easeOut(clamp((t-3.5-i*0.15)/0.5,0,1));
      if(barW>0){
        roundRect(rx-140,sy+10,barW,12,6);
        ctx.fillStyle=s.color;ctx.fill();
      }
    });

    // Flags count
    if(t>4.5){
      const fa=clamp((t-4.5)/0.3,0,1);
      ctx.globalAlpha=ra*fa;
      txt('2,847 / 3,823 flags',rx,490,16,GREEN,'600');
    }

    // Check mark
    if(t>5){
      const ca=clamp((t-5)/0.3,0,1);
      ctx.globalAlpha=ca;
      ctx.beginPath();ctx.arc(rx,440,28,0,Math.PI*2);ctx.fillStyle='rgba(122,214,42,0.2)';ctx.fill();
      txt('✓',rx,440,28,GREEN,'800');
    }

    txt('Portfolio',rx,580,20,'#fff','500');
    txt('"I solved the problem"',rx,610,16,GREEN,'500');
    ctx.restore();
  }

  // CTA
  if(t>6){
    const ca=clamp((t-6)/0.5,0,1);
    ctx.save();ctx.globalAlpha=ca;
    roundRect(W/2-160,H-80,320,48,24);
    ctx.fillStyle=GREEN;ctx.fill();
    txt('Build proof → xpertclass.academy',W/2,H-56,16,NAVY,'700');
    ctx.restore();
  }
};
ctx.fillStyle=NAVY;ctx.fillRect(0,0,W,H);
</script>
</body>
</html>
