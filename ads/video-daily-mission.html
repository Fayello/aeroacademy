<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Mission</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0f1a;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,ctx=document.getElementById('c').getContext('2d');
const NAVY='#0a0f1a',GREEN='#7AD62A';
function easeOut(t){return 1-Math.pow(1-t,3)}
function easeOutBack(t){const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function txt(s,x,y,sz,col,wght,al){ctx.font=(wght||'400')+' '+(sz||24)+'px system-ui,sans-serif';ctx.fillStyle=col||'#fff';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}

const missions=[
  {name:'Complete 3 Security Labs',xp:'+450 XP',icon:'🔒',color:'#10b981'},
  {name:'Capture 10 Flags',xp:'+200 XP',icon:'🚩',color:'#ef4444'},
  {name:'Solve a DevOps Challenge',xp:'+300 XP',icon:'⚙️',color:'#3b82f6'},
];

window.renderAt=function(t){
  ctx.fillStyle=NAVY;ctx.fillRect(0,0,W,H);

  // Grid
  ctx.save();ctx.globalAlpha=0.04;ctx.strokeStyle=GREEN;ctx.lineWidth=0.5;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();

  // Particles
  ctx.save();ctx.globalAlpha=0.3;
  for(let i=0;i<15;i++){
    const px=(i*113.7+Math.sin(t*0.3+i*1.7)*30)%W;
    const py=(i*79.3+Math.cos(t*0.2+i*2.1)*30)%H;
    ctx.beginPath();ctx.arc(px,py,1.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(122,214,42,${0.08+Math.sin(t*0.5+i)*0.04})`;ctx.fill();
  }
  ctx.restore();

  // Header notification style
  if(t<10){
    const ha=clamp((t-0.2)/0.4,0,1);
    ctx.save();ctx.globalAlpha=ha;
    roundRect(W/2-200,60,400,60,12);
    ctx.fillStyle='rgba(30,41,59,0.9)';ctx.fill();
    ctx.strokeStyle=GREEN+'40';ctx.lineWidth=1;ctx.stroke();
    // Notification dot
    ctx.beginPath();ctx.arc(W/2-170,90,6,0,Math.PI*2);ctx.fillStyle=GREEN;ctx.fill();
    txt('Your daily mission is waiting',W/2+10,90,16,'#e2e8f0','500');
    ctx.restore();
  }

  // Mission cards
  missions.forEach((m,i)=>{
    const delay=1.0+i*0.6;
    const appear=clamp((t-delay)/0.5,0,1);
    const scale=easeOutBack(appear);

    const cx=W/2;
    const cy=260+i*160;
    const cw=600,ch=120;

    ctx.save();ctx.globalAlpha=appear;
    const sw=cw*scale,ch2=ch*scale;
    roundRect(cx-sw/2,cy-ch2/2,sw,ch2,14);
    ctx.fillStyle='rgba(15,23,42,0.9)';ctx.fill();
    ctx.strokeStyle=m.color+'30';ctx.lineWidth=1.5;ctx.stroke();

    // Icon
    roundRect(cx-sw/2+20,cy-ch2/2+20,ch2-40,ch2-40,10);
    ctx.fillStyle=m.color+'15';ctx.fill();
    txt(m.icon,cx-sw/2+20+(ch2-40)/2,cy,24);

    // Mission text
    txt(m.name,cx+20,cy-15,20,'#e2e8f0','600','left');
    txt(m.xp,cx+20,cy+15,16,GREEN,'600','left');

    // Check animation
    const checkT=t-delay-0.8;
    if(checkT>0){
      const ca=clamp(checkT/0.3,0,1);
      ctx.globalAlpha=appear*ca;
      ctx.beginPath();ctx.arc(cx+sw/2-40,cy,16,0,Math.PI*2);
      ctx.fillStyle=GREEN+'30';ctx.fill();
      txt('✓',cx+sw/2-40,cy,14,GREEN,'700');
    }

    ctx.restore();
  });

  // XP bar
  if(t>3.5){
    const ba=clamp((t-3.5)/0.4,0,1);
    ctx.save();ctx.globalAlpha=ba;
    const bx=W/2-250,by=H-160,bw=500,bh=24;
    roundRect(bx,by,bw,bh,12);
    ctx.fillStyle='#1e293b';ctx.fill();
    const fill=bw*easeOut(clamp((t-4)/2,0,1));
    roundRect(bx,by,fill,bh,12);
    const g=ctx.createLinearGradient(bx,0,bx+fill,0);
    g.addColorStop(0,'#229C62');g.addColorStop(1,GREEN);
    ctx.fillStyle=g;ctx.fill();
    txt('Level 12 → 13',W/2,by-16,14,'#94a3b8','500');
    txt(`${Math.round(950*easeOut(clamp((t-4)/2,0,1)))} / 1000 XP`,W/2,by+bh+16,13,GREEN,'600');
    ctx.restore();
  }

  // CTA
  if(t>5){
    const ca=clamp((t-5)/0.5,0,1);
    ctx.save();ctx.globalAlpha=ca;
    roundRect(W/2-140,H-80,280,44,22);
    ctx.fillStyle=GREEN;ctx.fill();
    txt('Start your mission',W/2,H-58,16,NAVY,'700');
    ctx.restore();
  }
};
ctx.fillStyle=NAVY;ctx.fillRect(0,0,W,H);
</script>
</body>
</html>
