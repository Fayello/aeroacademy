input {
  tcp {
    port => 1514
    codec => json
  }
  beats {
    port => 5044
  }
}

filter {
  if [type] == "wazuh" {
    mutate {
      add_field => { "index_prefix" => "wazuh-alerts" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[index_prefix]}-%{+YYYY.MM.dd}"
  }
}
