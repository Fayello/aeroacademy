user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 10m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    limit_req_zone $binary_remote_addr zone=general:10m rate=2000r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=300r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    upstream backend {
        server 127.0.0.1:4000;
        keepalive 32;
    }

    upstream frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    map $request_uri $waf_sql {
        default 0;
        ~*union.*select 1;
        ~*select.*from 1;
        ~*insert.*into 1;
        ~*delete.*from 1;
        ~*drop.*table 1;
        ~*update.*set 1;
    }

    map $request_uri $waf_xss {
        default 0;
        ~*<script 1;
        ~*%3cscript 1;
        ~*javascript: 1;
        ~*onload= 1;
        ~*onerror= 1;
        ~*onclick= 1;
        ~*document.cookie 1;
        ~*document.write 1;
    }

    map $request_uri $waf_path {
        default 0;
        ~*\.\./ 1;
        ~*\.\.%2f 1;
        ~*%2e%2e 1;
        ~*etc/passwd 1;
        ~*etc/shadow 1;
        ~*proc/self 1;
        ~*php://input 1;
    }

    map $http_user_agent $waf_bot {
        default 0;
        ~*acunetix 1;
        ~*nikto 1;
        ~*sqlmap 1;
        ~*masscan 1;
        ~*openvas 1;
        ~*nessus 1;
        ~*gobuster 1;
        ~*dirbuster 1;
        ~*whatweb 1;
        ~*havij 1;
        ~*w3af 1;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name xpertclass.academy;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name xpertclass.academy;

        ssl_certificate /etc/letsencrypt/live/xpertclass.academy/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xpertclass.academy/privkey.pem;
        ssl_dhparam /etc/nginx/ssl/dhparam.pem;

        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsecurity_includes.conf;

        limit_conn conn_limit 500;

        if ($waf_sql) { return 403; }
        if ($waf_xss) { return 403; }
        if ($waf_path) { return 403; }
        if ($waf_bot) { return 403; }

        # Honeypot traps
        location = /.env { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /admin.php { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /wp-login.php { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /wp-admin/install.php { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /phpmyadmin { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /phpMyAdmin { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /.git/config { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /.git/HEAD { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /id_rsa { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /id_dsa { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /authorized_keys { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /server-status { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /server-info { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /debug { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /console { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /_debug { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /swagger { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /api-docs { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /graphql { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /dump.sql { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /backup.sql { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /adminer.php { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /manager/html { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /etc/passwd { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location = /etc/shadow { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location ~* \.(sql|mdb|db|sqlite)$ { access_log /var/log/nginx/honeypot.log combined; return 444; }
        location ~* \.(bak|old|orig|save|swp)$ { access_log /var/log/nginx/honeypot.log combined; return 444; }

        # WebSocket: Socket.io
        location /socket.io/ {
            proxy_pass http://backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # All API requests → backend (versioned: /api/1/* and /api/1.2/*)
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # OAuth callback → frontend
        location /auth/callback {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Static assets with long cache
        location /_next/static/ {
            proxy_pass http://frontend/_next/static/;
            add_header Cache-Control "public, immutable, max-age=2592000";
        }

        # Default: frontend catch-all
        location / {
            limit_req zone=general burst=2000 nodelay;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Block dotfiles
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|git|svn|htaccess|htpasswd|ini|log|bak|sql|tar|gz|zip)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
